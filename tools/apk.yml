name: APK und AAB bauen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android-SDK-Lizenzen bestätigen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pakete installieren
        run: npm ci

      - name: App-Dateien nach Android kopieren
        run: npx cap sync android

      - name: Signier-Schlüssel aus den Secrets holen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 fehlt (Settings → Secrets and variables → Actions)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tempasto.keystore"

      - name: APK und AAB bauen
        working-directory: android
        env:
          TEMPASTO_KEYSTORE: ${{ runner.temp }}/tempasto.keystore
          TEMPASTO_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TEMPASTO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TEMPASTO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Dateien umbenennen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Tempasto-${{ github.run_number }}.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Tempasto-${{ github.run_number }}.aab

      - name: APK als Download ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Tempasto-APK-${{ github.run_number }}
          path: Tempasto-${{ github.run_number }}.apk

      - name: AAB für Google Play als Download ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Tempasto-AAB-${{ github.run_number }}
          path: Tempasto-${{ github.run_number }}.aab

      - name: Release mit APK anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tempasto ${{ github.run_number }}
          files: Tempasto-${{ github.run_number }}.apk
